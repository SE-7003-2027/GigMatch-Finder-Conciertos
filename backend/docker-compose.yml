services:
  db:
    image: postgres:15
    container_name: postgres_gigmatch
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      #Mapeando la carpeta db al inicializador del contenedor
      - ./db:/docker-entrypoint-initdb.d
      #Volumen persistente para que los datos sobrevivan si se llegase a borrar el contenedor
      - gigmatch_postgres_data:/var/lib/postgresql/data

volumes:
  gigmatch_postgres_data: